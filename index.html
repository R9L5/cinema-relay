<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Cinema Relay</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; background: #000; overflow: hidden; }
    #holder { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
    #holder iframe {
        position: fixed; top: 0; left: 0;
        width: 100vw !important; height: 100vh !important;
        border: 0 !important; display: block;
    }
    #idle {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #fff; font-family: Arial, sans-serif; font-size: 8vw; font-weight: bold;
        background: linear-gradient(135deg, #1e3c72, #2a5298); z-index: 5;
    }
</style>
</head>
<body>
    <div id="idle">🎬 CINEMA</div>
    <div id="holder"></div>

<script>
    let curVolume = 50, curMuted = false;
    let curVideo = null, curTime = 0, curDuration = 0;

    function showIdle(s){ document.getElementById('idle').style.display = s ? 'flex' : 'none'; }

    function build(videoId){
        const h = document.getElementById('holder');
        h.innerHTML = '';
        if(!videoId){ showIdle(true); return; }
        showIdle(false);
        // nocookie + enablejsapi : يدعم التحكم (تقديم/ترجيع/صوت)
        const params = [
            'autoplay=1','mute=0','controls=0','rel=0','modestbranding=1',
            'iv_load_policy=3','disablekb=1','fs=0','playsinline=1',
            'enablejsapi=1','origin=' + location.origin
        ].join('&');
        const f = document.createElement('iframe');
        f.id = 'yt';
        f.setAttribute('width','100%'); f.setAttribute('height','100%');
        f.allow = 'autoplay; encrypted-media';
        f.setAttribute('frameborder','0');
        f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
        f.src = 'https://www.youtube-nocookie.com/embed/' + videoId + '?' + params;
        h.appendChild(f);
    }

    function cmd(func, args){
        const f = document.getElementById('yt');
        if(!f || !f.contentWindow) return;
        f.contentWindow.postMessage(JSON.stringify({event:'command', func:func, args:args||[]}), '*');
    }
    function applyVol(){ cmd('setVolume',[curVolume]); curMuted ? cmd('mute') : cmd('unMute'); }

    // ارسال حالة الوقت للنافذة الأصل (player.html) كل ثانية
    function reportTime(){
        if(window.parent){
            window.parent.postMessage(JSON.stringify({
                cinemaTime: true, time: curTime, duration: curDuration, playing: curVideo!=null
            }), '*');
        }
    }
    setInterval(reportTime, 1000);

    window.addEventListener('message', function(ev){
        let d = ev.data;
        if(typeof d === 'string'){ try{ d = JSON.parse(d); }catch(e){ return; } }
        if(!d) return;

        // احداث يوتيوب
        if(d.event === 'infoDelivery' && d.info){
            if(typeof d.info.currentTime === 'number') curTime = d.info.currentTime;
            if(typeof d.info.duration === 'number' && d.info.duration > 0) curDuration = d.info.duration;
        }
        if(d.event === 'onStateChange' && d.info === 0 && curVideo){ curTime = 0; cmd('seekTo', [0, true]); cmd('playVideo'); return; }

        if(!d.action) return;
        switch(d.action){
            case 'load':
                curVideo = d.videoId; curTime = 0; curDuration = 0;
                curVolume = (typeof d.volume==='number') ? d.volume : curVolume;
                curMuted = !!d.muted;
                build(d.videoId);
                setTimeout(()=>{
                    applyVol(); cmd('playVideo');
                    const f = document.getElementById('yt');
                    if(f && f.contentWindow){ f.contentWindow.postMessage(JSON.stringify({event:'listening'}), '*'); }
                }, 1500);
                break;
            case 'stop':   curVideo = null; curTime = 0; curDuration = 0; build(null); break;
            case 'pause':  cmd('pauseVideo'); break;
            case 'resume': cmd('playVideo'); break;
            case 'seek':   // نسبي بالثواني
                curTime = Math.max(0, curTime + (d.seconds || 0));
                cmd('seekTo', [curTime, true]); cmd('playVideo'); break;
            case 'seekPercent': // مطلق بالنسبة المئوية 0..100
                if(curDuration > 0){
                    curTime = curDuration * (d.percent/100);
                    cmd('seekTo', [curTime, true]); cmd('playVideo');
                }
                break;
            case 'volume': curVolume = d.volume; applyVol(); break;
            case 'mute':   curMuted = true; cmd('mute'); break;
            case 'unmute': curMuted = false; cmd('unMute'); cmd('setVolume',[curVolume]); break;
        }
    });

    const v = new URLSearchParams(location.search).get('v');
    if(v) build(v);
</script>
