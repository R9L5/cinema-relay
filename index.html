<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinema YouTube Relay</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; }
    #youtube-player, iframe {
        position:fixed;
        inset:0;
        width:100% !important;
        height:100% !important;
        border:0 !important;
        background:#000;
    }
    #idle {
        position:fixed;
        inset:0;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#fff;
        font-family:Arial, sans-serif;
        font-size:7vw;
        font-weight:900;
        background:linear-gradient(135deg,#10131d,#05070c);
        z-index:5;
    }
    #err {
        position:fixed;
        left:18px; right:18px; bottom:18px;
        display:none;
        z-index:20;
        color:#fff;
        font:18px Arial,sans-serif;
        text-align:center;
        padding:12px;
        border-radius:14px;
        background:rgba(0,0,0,.72);
        border:1px solid rgba(255,255,255,.18);
    }
</style>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <div id="idle">🎬 CINEMA</div>
    <div id="youtube-player"></div>
    <div id="err"></div>

<script>
// NOCOOKIE_REAPPLIED_RANGE_UI: YouTube privacy enhanced host is forced here.
    // نفس طريقة سكربت الراديو: YouTube IFrame API مباشرة
    // NoCookie mode: host = youtube-nocookie.com
    let player = null;
    let playerReady = false;
    let pendingVideo = null;
    let currentVideoId = null;
    let lastVolume = 50;
    let lastMuted = false;

    function showIdle(show) {
        document.getElementById('idle').style.display = show ? 'flex' : 'none';
    }

    function showErr(msg) {
        const e = document.getElementById('err');
        e.textContent = msg || '';
        e.style.display = msg ? 'block' : 'none';
    }

    function safe(fn) {
        try {
            if (player && typeof fn === 'function') fn();
        } catch (e) {}
    }

    function applyAudio() {
        safe(function() {
            const v = Math.max(0, Math.min(100, Number(lastVolume) || 0));
            player.setVolume(v);
            if (lastMuted || v <= 0) player.mute();
            else player.unMute();
        });
    }

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-player', {
            host: 'https://www.youtube-nocookie.com',
            height: '100%',
            width: '100%',
            playerVars: {
                disablekb: 1,
                autoplay: 1,
                controls: 0,
                modestbranding: 1,
                rel: 0,
                fs: 0,
                iv_load_policy: 3,
                playsinline: 1,
                cc_load_policy: 0,
                showinfo: 0,
                autohide: 1,
                origin: window.location.origin
            },
            events: {
                onReady: onPlayerReady,
                onStateChange: onPlayerStateChange,
                onError: onPlayerError
            }
        });
    }

    function onPlayerReady(event) {
        playerReady = true;
        applyAudio();

        if (pendingVideo) {
            const p = pendingVideo;
            pendingVideo = null;
            loadVideo(p);
        }
    }

    function onPlayerStateChange(event) {
        if (event && event.data === YT.PlayerState.ENDED) { try { parent.postMessage(JSON.stringify({ action:'ended' }), '*'); } catch(e) {} } // CLEAN_AUTONEXT_RELAY_ENDED_V12
        if (event.data === YT.PlayerState.ENDED) { try { parent.postMessage(JSON.stringify({ action:'ended' }), '*'); } catch(e) {} } // REAL_QUEUE_AUTONEXT_RELAY_V11
        if (event.data === YT.PlayerState.PLAYING) {
            showIdle(false);
            showErr('');
            applyAudio();
        } else if (event.data === YT.PlayerState.ENDED) {
            try { parent.postMessage(JSON.stringify({ action: 'ended' }), '*'); } catch(e) {}
        }
    }

    function onPlayerError(event) {
        showErr('YouTube Error: ' + (event && event.data ? event.data : 'unknown'));
    }

    function loadVideo(data) {
        if (!data || !data.videoId) return;

        currentVideoId = data.videoId;
        lastVolume = data.volume !== undefined ? Number(data.volume) : lastVolume;
        lastMuted = !!data.muted;

        if (!playerReady || !player) {
            pendingVideo = data;
            return;
        }

        const start = Math.floor(Number(data.start || 0) || 0);
        showIdle(false);
        showErr('');

        try {
            player.loadVideoById(data.videoId, start);
            setTimeout(function() {
                applyAudio();
                safe(function(){ player.playVideo(); });
            }, 300);
        } catch(e) {
            showErr('Failed to load video');
        }
    }

    function stopVideo() {
        safe(function() {
            player.stopVideo();
        });
        currentVideoId = null;
        showIdle(true);
    }

    function seekRelative(seconds) {
        safe(function() {
            const cur = Number(player.getCurrentTime && player.getCurrentTime()) || 0;
            const dur = Number(player.getDuration && player.getDuration()) || 0;
            let target = cur + Number(seconds || 0);
            if (target < 0) target = 0;
            if (dur > 0 && target > dur) target = dur - 0.2;
            player.seekTo(target, true);
        });
    }

    function seekPercent(percent) {
        safe(function() {
            const dur = Number(player.getDuration && player.getDuration()) || 0;
            if (dur <= 0) return;
            let p = Math.max(0, Math.min(100, Number(percent) || 0));
            player.seekTo(dur * (p / 100), true);
        });
    }

    function seekTo(seconds) {
        safe(function() {
            const dur = Number(player.getDuration && player.getDuration()) || 0;
            let target = Math.max(0, Number(seconds) || 0);
            if (dur > 0 && target > dur) target = dur - 0.2;
            player.seekTo(target, true);
        });
    }

    window.addEventListener('message', function(ev) {
        let d = ev.data;
        if (typeof d === 'string') {
            try { d = JSON.parse(d); } catch(e) { return; }
        }
        if (!d || !d.action) return;

        switch (d.action) {
            case 'load':
                loadVideo(d);
                break;
            case 'stop':
                stopVideo();
                break;
            case 'pause':
                safe(function(){ player.pauseVideo(); });
                break;
            case 'resume':
                safe(function(){ player.playVideo(); });
                break;
            case 'volume':
                lastVolume = Number(d.volume) || 0;
                applyAudio();
                break;
            case 'mute':
                lastMuted = true;
                applyAudio();
                break;
            case 'unmute':
                lastMuted = false;
                applyAudio();
                break;
            case 'seek':
                seekRelative(d.seconds);
                break;
            case 'seekPercent':
                seekPercent(d.percent);
                break;
            case 'seekTo':
                seekTo(d.seconds);
                break;
        }
    });

    // اختبار مباشر من المتصفح:
    const directId = new URLSearchParams(location.search).get('v');
    if (directId) loadVideo({ action:'load', videoId:directId, volume:50, muted:false });
</script>
</body>
</html>
