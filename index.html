<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Cinema Relay</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; background: #000; overflow: hidden; }
    #holder { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
    #holder iframe {
        position: fixed; top: 0; left: 0;
        width: 100vw !important; height: 100vh !important;
        border: 0 !important; display: block;
    }
    #idle {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #fff; font-family: Arial, sans-serif; font-size: 8vw; font-weight: bold;
        background: linear-gradient(135deg, #1e3c72, #2a5298); z-index: 5;
    }
</style>
</head>
<body>
    <div id="idle">🎬 CINEMA</div>
    <div id="holder"></div>

<script>
    let curVolume = 50, curMuted = false;
    function showIdle(s){ document.getElementById('idle').style.display = s ? 'flex' : 'none'; }
    function build(videoId){
        const h = document.getElementById('holder');
        h.innerHTML = '';
        if(!videoId){ showIdle(true); return; }
        showIdle(false);
        const f = document.createElement('iframe');
        f.id = 'yt';
        f.setAttribute('width', '100%');
        f.setAttribute('height', '100%');
        f.allow = 'autoplay; encrypted-media';
        f.setAttribute('frameborder','0');
        f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
        // yout-ube.com (بشرطة) = بدون اعلانات
        f.src = 'https://www.yout-ube.com/watch?v=' + videoId + '&autoplay=1';
        h.appendChild(f);
    }
    function cmd(func, args){
        const f = document.getElementById('yt');
        if(!f || !f.contentWindow) return;
        f.contentWindow.postMessage(JSON.stringify({event:'command', func:func, args:args||[]}), '*');
    }
    function applyVol(){ cmd('setVolume',[curVolume]); curMuted ? cmd('mute') : cmd('unMute'); }
    let curVideo = null;
    let curTime = 0;
    window.addEventListener('message', function(ev){
        let d = ev.data;
        if(typeof d === 'string'){ try{ d = JSON.parse(d); }catch(e){ return; } }
        if(!d) return;
        if(d.event === 'infoDelivery' && d.info && typeof d.info.currentTime === 'number'){ curTime = d.info.currentTime; }
        if(d.event === 'onStateChange' && d.info === 0 && curVideo){ curTime = 0; cmd('seekTo', [0, true]); cmd('playVideo'); return; }
        if(!d.action) return;
        switch(d.action){
            case 'load':
                curVideo = d.videoId; curTime = 0;
                curVolume = (typeof d.volume==='number') ? d.volume : curVolume;
                curMuted = !!d.muted;
                build(d.videoId);
                setTimeout(()=>{ applyVol(); cmd('playVideo');
                    const f = document.getElementById('yt');
                    if(f && f.contentWindow){ f.contentWindow.postMessage(JSON.stringify({event:'listening'}), '*'); }
                }, 1500);
                break;
            case 'stop':   curVideo = null; curTime = 0; build(null); break;
            case 'pause':  cmd('pauseVideo'); break;
            case 'resume': cmd('playVideo'); break;
            case 'seek':   curTime = Math.max(0, curTime + (d.seconds || 0)); cmd('seekTo', [curTime, true]); cmd('playVideo'); break;
            case 'volume': curVolume = d.volume; applyVol(); break;
            case 'mute':   curMuted = true; cmd('mute'); break;
            case 'unmute': curMuted = false; cmd('unMute'); cmd('setVolume',[curVolume]); break;
        }
    });
    const v = new URLSearchParams(location.search).get('v');
    if(v) build(v);
</script>
</body>
</html>
